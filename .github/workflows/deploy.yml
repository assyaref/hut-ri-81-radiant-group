name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Verify Vite output
        shell: bash
        run: |
          test -f dist/index.html
          echo "dist/index.html exists"

          echo "Checking generated assets..."
          find dist/assets -maxdepth 1 -type f -print

          if grep -q "/src/main.tsx" dist/index.html; then
            echo "ERROR: Vite source entry detected in dist/index.html"
            exit 1
          fi

          if grep -q "src/main.tsx" dist/index.html; then
            echo "ERROR: source main.tsx reference detected"
            exit 1
          fi

          echo "Vite production output verified."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4